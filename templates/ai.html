<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI | DI KIOSK</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="page-ai">
    <header class="header">
        <a class="header__left" href="javascript:history.back()">
            <img class="header__icon" src="/static/assets/arrow_left_alt_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg">
        </a>
        <a class="header__middle" href="index.html">
            <img class="header__logo" src="/static/assets/title.svg">
        </a>
        <button class="header__right header__button" onclick="resetSession()">
            <img class="header__icon" src="/static/assets/autorenew_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg">
        </button>
    </header>

    <main>
        <div class="ai-controls">
            <label for="ai-persona">Personality:</label>
            <select id="ai-persona">
                <option value="helpful, polite and professional Salesman">Standard Professional</option>
                <option value="a grumpy, sarcastic old man who complains about modern technology">Grumpy Old Man</option>
                <option value="an overly enthusiastic surfer dude who uses lots of slang">Surfer Dude</option>
                <option value="speaking strictly in medieval Shakespearean English">Shakespearean</option>
            </select>
        </div>

        <div id="chat-box" class="chat-container"></div>
        <div id="options-area" class="chat-options"></div>

    </main>

    <footer class="footer">
        <p>Made for FS26.COMPP</p>
    </footer>

    <script src="/static/script.js"></script>
</body>
</html>
